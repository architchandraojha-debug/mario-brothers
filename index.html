<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mario Brothers</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    header { background: #333; color: #fff; padding: 1rem; text-align: center; }
    main { padding: 2rem; max-width: 600px; margin: auto; }
    .hidden { display: none; }
    form, .notice-board { background: #fff; padding: 1rem; border-radius: 5px; margin-top: 1rem; }
    input, textarea, button { width: 100%; padding: 0.5rem; margin: 0.5rem 0; }
    button { background: #333; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #555; }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to Mario Brothers</h1>
  </header>

  <main>
    <!-- Join Request Form (always visible for new visitors) -->
    <div id="join-section">
      <h2>Request to Join</h2>
      <form id="joinForm" action="https://formspree.io/f/mbdwjvnq" method="POST">
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="text" name="name" placeholder="Why do you want to join?" required></textarea>
        <button type="submit">Submit Request</button>
      </form>
      <p id="joinMessage"></p>
    </div>

    <!-- PIN Entry (hidden until approved) -->
    <div id="pin-section" class="hidden">
      <h2>Enter PIN to Access Group</h2>
      <input type="text" id="pinInput" placeholder="Enter PIN">
      <button onclick="checkPin()">Submit</button>
      <p id="pinMessage"></p>
    </div>

    <!-- Protected Notice Board (hidden until PIN is valid) -->
    <div id="notice-board" class="hidden">
      <h2>Group Notice Board</h2>
      <div class="notice-board">
        <p><strong>Admin Notice:</strong> First meetup on Saturday!</p>
      </div>
    </div>
  </main>

  <script>
    // Single PIN: TECHNOLOGIA
    const validPin = "TECHNOLOGIA";

    // Handle PIN check
    function checkPin() {
      const pin = document.getElementById("pinInput").value.trim();
      if (pin === validPin) {
        document.getElementById("join-section").classList.add("hidden");
        document.getElementById("pin-section").classList.add("hidden");
        document.getElementById("notice-board").classList.remove("hidden");
      } else {
        document.getElementById("pinMessage").innerText = "Invalid PIN.";
      }
    }

    // Show PIN section after form submission
    document.getElementById("joinForm").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("joinMessage").innerText =
        "Request submitted successfully! Admin will review your request.";
      document.getElementById("pin-section").classList.remove("hidden");
      document.getElementById("joinForm").reset();
    });
  </script>
</body>
</html>
