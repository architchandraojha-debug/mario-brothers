<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mario Brothers</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    header { background: #333; color: #fff; padding: 1rem; text-align: center; }
    main { padding: 2rem; max-width: 800px; margin: auto; }
    .hidden { display: none; }
    .notice-board { background: #fff; padding: 1rem; border-radius: 5px; margin-top: 1rem; }
    input, button { width: 100%; padding: 0.5rem; margin: 0.5rem 0; }
    button { background: #333; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #555; }
    iframe { width: 100%; border: none; }
  </style>
</head>
<body>
  <header>
    <h1>Welcome to Mario Brothers</h1>
  </header>

  <main>
    <!-- Google Form Embed -->
    <div id="join-section">
      <h2>Request to Join</h2>
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSckn0LjOMDHdao-aet1J4RKIdNp2Wd7_TfeXazGDIG3DIyO1A/viewform?usp=header/viewform?embedded=true" 
              width="640" height="600" frameborder="0" marginheight="0" marginwidth="0">
        Loading…
      </iframe>
    </div>

    <!-- PIN Entry -->
    <div id="pin-section">
      <h2>Enter PIN to Access Group</h2>
      <input type="text" id="pinInput" placeholder="Enter PIN">
      <button onclick="checkPin()">Submit</button>
      <p id="pinMessage"></p>
    </div>

    <!-- Protected Notice Board -->
    <div id="notice-board" class="hidden">
      <h2>Group Notice Board</h2>
      <div class="notice-board">
        <p><strong>Admin Notice:</strong> First meetup on Saturday!</p>
      </div>
    </div>
  </main>

  <script>
    // Single PIN: TECHNOLOGIA
    const validPin = "TECHNOLOGIA";

    function checkPin() {
      const pin = document.getElementById("pinInput").value.trim();
      if (pin === validPin) {
        document.getElementById("notice-board").classList.remove("hidden");
        document.getElementById("pinMessage").innerText = "";
      } else {
        document.getElementById("pinMessage").innerText = "Invalid PIN.";
      }
    }
  </script>
</body>
</html>
